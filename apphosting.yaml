# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

  # Environment variables and secrets.
  # env:
  # Configure environment variables.
  # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
  # - variable: MESSAGE
  #   value: Hello world!
  #   availability:
  #     - BUILD
  #     - RUNTIME

  # Grant access to secrets in Cloud Secret Manager.
  # You can create secrets with the CLI command `firebase apphosting:secrets:set <secretName>`.
  # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
  # - variable: MY_SECRET
  #   secret: mySecretRef
env:
  - variable: NUXT_GIF_SERVICE_URL
    secret: NUXT_GIF_SERVICE_URL
  - variable: NUXT_PNG2SS_SERVICE_URL
    secret: NUXT_PNG2SS_SERVICE_URL
  - variable: NUXT_INTERNAL_KEY
    secret: NUXT_INTERNAL_KEY
  # 廣告供應商覆寫：'adsense' | 'monetag' | 'none'
  # 不設此變數時會使用 nuxt.config.ts runtimeConfig 的預設值 'monetag'
  # - variable: NUXT_PUBLIC_AD_PROVIDER
  #   value: none
  #   availability:
  #     - BUILD
  #     - RUNTIME
  #
  # 暫時關閉 Monetag Multitag（含 onClick popunder，侵略性過強）
  # 填入任何非 URL 字串即可達成關閉效果（例如 "disabled"）。
  # Firebase App Hosting 的 schema 不接受空字串作為 env value，
  # 所以不能寫 value: ""。
  # app.vue 的 isValidAdScriptSrc() 只接受 http(s):// 開頭的完整 URL，
  # "disabled" 會被過濾掉，script 不會被注入。
  # 要恢復時刪除或註解下方整段即可（nuxt.config.ts 的預設值仍保留完整）
  # 關閉 Monetag Multitag（onClick popunder）
  - variable: NUXT_PUBLIC_MONETAG_MULTITAG_SRC
    value: disabled
    availability:
      - BUILD
      - RUNTIME
  # 關閉 Monetag Push Notifications（含 Service Worker tombstone 清理）
  - variable: NUXT_PUBLIC_MONETAG_PUSH_SRC
    value: disabled
    availability:
      - BUILD
      - RUNTIME
  # 關閉 Monetag In-Page Push（浮動 banner）
  - variable: NUXT_PUBLIC_MONETAG_INPAGE_PUSH_SRC
    value: disabled
    availability:
      - BUILD
      - RUNTIME
  # 關閉 Monetag Vignette（插頁式廣告）
  - variable: NUXT_PUBLIC_MONETAG_VIGNETTE_SRC
    value: disabled
    availability:
      - BUILD
      - RUNTIME
  # Direct Link 保留（由 nuxt.config.ts 預設值生效）
